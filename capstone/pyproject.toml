[project]
name = "rafeeq"
version = "1.0.0"
description = "Rafeeq: Madar Municipal Services' permit assistant (SDAIA Academy Agentic AI capstone, Track 1)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "openai>=3.30",          # Chat Completions client for OpenRouter
    "pydantic>=2.12",        # tool schemas from type hints
    "python-dotenv>=1.1",    # .env
    "pandas>=2.2",           # eval tables
    "mcp>=2.3",              # MCP server and client
    "tokenizers>=0.21",      # token counts for the context report
    "fastapi>=0.150",        # the HTTP API
    "uvicorn>=0.40",
    "opentelemetry-sdk>=1.45",  # traces
]

[project.scripts]
rafeeq = "rafeeq.cli:main"

[dependency-groups]
dev = ["pytest>=9.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rafeeq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
