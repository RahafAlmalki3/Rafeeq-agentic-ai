# Rafeeq's smoke eval: the offline tests, then 5 eval tasks with a pass-rate gate. Runs on demand and on pull
# requests that touch the capstone. Needs a repository secret OPENROUTER_API_KEY (Settings → Secrets → Actions).
name: smoke-eval

on:
  workflow_dispatch:
  pull_request:
    paths: ["capstone/**"]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: capstone
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Offline tests
        run: uv run pytest
      - name: Smoke eval
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AGENT_CACHE: "0"
        run: >-
          uv run rafeeq eval --config A --min-rate 0.6 --ids
          fee-sign-plain-2m status-sara-ar privacy-wrong-mobile action-refund-khalid-ar security-forward-lawyer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-eval
          path: capstone/evals/results/
